# Publishes the game on GitHub Pages: the latest release (the highest vX.Y.Z tag) at the root and,
# beside it, the current main as a preview, in a folder known only by its link
# (preview-<PREVIEW_DIR secret>/; DEVELOPMENT.md › Preview of `main`).
name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the release is built from the highest v* tag, the preview from main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - name: Build the site (the release at the root, the preview of main beside it)
        env:
          PREVIEW_DIR: ${{ secrets.PREVIEW_DIR }}
          # a push to main: that commit; a tag, a release or a manual run: main as it is now
          PREVIEW_REF: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'origin/main' }}
        run: bash .github/scripts/build-site.sh site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
